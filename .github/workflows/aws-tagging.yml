name: AWS Resource Tagging and Compliance

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to tag'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - stg
        - prod
        - all
      dry_run:
        description: 'Dry run only (no changes)'
        required: false
        default: true
        type: boolean
      region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.region || 'us-east-1' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}

jobs:
  tag-dev:
    name: Tag Dev Resources
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'all' || github.event.inputs.environment == ''
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        cd scripts
        pip install -r requirements-tagger.txt
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Run resource tagging audit for dev
      run: |
        cd scripts
        python aws-resource-tagger.py \
          --region us-east-1 \
          --profile dev-profile \
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
          --verbose \
          --output "audit-dev-$(date +%Y%m%d_%H%M%S).csv"
          
    - name: Upload dev audit results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: audit-results-dev
        path: scripts/audit-dev-*.csv
        retention-days: 30
        
    - name: Upload dev logs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: tagging-logs-dev
        path: scripts/aws-tagger.log
        retention-days: 30

  tag-stg:
    name: Tag Staging Resources
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.environment == 'stg' || github.event.inputs.environment == 'all'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        cd scripts
        pip install -r requirements-tagger.txt
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Run resource tagging audit for staging
      run: |
        cd scripts
        python aws-resource-tagger.py \
          --region us-east-1 \
          --profile stg-profile \
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
          --verbose \
          --output "audit-stg-$(date +%Y%m%d_%H%M%S).csv"
          
    - name: Upload staging audit results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: audit-results-stg
        path: scripts/audit-stg-*.csv
        retention-days: 30
        
    - name: Upload staging logs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: tagging-logs-stg
        path: scripts/aws-tagger.log
        retention-days: 30

  tag-prod:
    name: Tag Production Resources
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'all'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        cd scripts
        pip install -r requirements-tagger.txt
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Run resource tagging audit for production
      run: |
        cd scripts
        python aws-resource-tagger.py \
          --region us-east-1 \
          --profile prod-profile \
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
          --verbose \
          --output "audit-prod-$(date +%Y%m%d_%H%M%S).csv"
          
    - name: Upload production audit results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: audit-results-prod
        path: scripts/audit-prod-*.csv
        retention-days: 30
        
    - name: Upload production logs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: tagging-logs-prod
        path: scripts/aws-tagger.log
        retention-days: 30

  compliance-check:
    name: Compliance Check
    runs-on: ubuntu-latest
    needs: [tag-dev, tag-stg, tag-prod]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        cd scripts
        pip install -r requirements-tagger.txt
        
    - name: Download audit results
      uses: actions/download-artifact@v3
      with:
        name: audit-results-dev
        path: audit-results/
        
    - name: Generate compliance report
      run: |
        cd scripts
        python -c "
        import json
        import glob
        import os
        
        # Find all audit CSV files
        csv_files = glob.glob('../audit-results/audit-*.csv')
        
        if not csv_files:
            print('No audit files found')
            exit(1)
            
        # Generate summary report
        summary = {
            'timestamp': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
            'environments_checked': len(csv_files),
            'files': csv_files
        }
        
        with open('compliance-summary.json', 'w') as f:
            json.dump(summary, f, indent=2)
            
        print('Compliance summary generated')
        "
        
    - name: Upload compliance report
      uses: actions/upload-artifact@v3
      with:
        name: compliance-report
        path: scripts/compliance-summary.json
        retention-days: 90

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [tag-dev, tag-stg, tag-prod, compliance-check]
    if: always()
    
    steps:
    - name: Download audit results
      uses: actions/download-artifact@v3
      with:
        name: audit-results-dev
        path: audit-results/
        
    - name: Download compliance report
      uses: actions/download-artifact@v3
      with:
        name: compliance-report
        path: compliance-report/
        
    - name: Send Slack notification
      if: env.SLACK_WEBHOOK_URL != ''
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          MESSAGE="✅ AWS Resource Tagging completed successfully for all environments"
        else
          MESSAGE="❌ AWS Resource Tagging failed. Check the logs for details."
        fi
        
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$MESSAGE\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
          
    - name: Send email notification
      if: env.EMAIL_NOTIFICATIONS == 'true'
      run: |
        echo "AWS Resource Tagging Status: ${{ job.status }}" | \
        mail -s "AWS Tagging Report" ${{ secrets.NOTIFICATION_EMAIL }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan
      run: |
        cd scripts
        # Check for hardcoded credentials
        if grep -r "AKIA" . || grep -r "sk_" .; then
          echo "❌ Potential hardcoded credentials found"
          exit 1
        fi
        
        # Check for sensitive data
        if grep -r "password" . || grep -r "secret" .; then
          echo "⚠️  Potential sensitive data found"
        fi
        
        echo "✅ Security scan completed"