apiVersion: v1
kind: Service
metadata:
  name: backend-app-green-service
  namespace: production
  labels:
    app: backend-app
    version: green
    environment: production
    deployment-type: green
spec:
  selector:
    app: backend-app
    version: green
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
