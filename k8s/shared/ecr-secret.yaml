# ECR secrets are now created dynamically by GitHub Actions workflow
# This file is kept for reference but the actual secrets are created
# with proper ECR authentication tokens during deployment
#
# The GitHub Actions workflow will create ECR secrets with:
# - Fresh ECR login tokens from aws ecr get-login-password
# - Proper base64 encoded auth field
# - Valid Docker config JSON format
#
# This prevents the "unable to parse auth field" error by ensuring
# the secrets contain actual authentication credentials instead of placeholders
